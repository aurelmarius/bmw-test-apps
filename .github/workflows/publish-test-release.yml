name: Publish Test Release

on:
  push:
    paths:
      - 'packages/**'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (leave empty to autodetect e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Release Metadata
        id: prep
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          python3 tools/prepare_release.py

      - name: Commit updated catalog.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json mgu-store.json
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-update catalog.json for release ${{ steps.prep.outputs.tag }}"
            git push origin main
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
          TITLE: ${{ steps.prep.outputs.title }}
        run: |
          echo "Processing release $TAG..."
          
          # Check if release already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets to existing release..."
            gh release upload "$TAG" packages/*.tgz mgu-store.json *.png --clobber
          else
            # test apps: published right away (no draft), so the Store offers them at once
            echo "Creating and publishing release $TAG..."
            gh release create "$TAG" packages/*.tgz mgu-store.json *.png \
              --latest \
              --title "$TITLE" \
              --notes-file release_notes.md
          fi
          
          echo "Release $TAG published: the Store offers it now."
