name: Publish Test Release

on:
  push:
    paths:
      - 'packages/**'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (leave empty to autodetect e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Release Metadata
        id: prep
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          python3 tools/prepare_release.py

      - name: Commit updated catalog.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json mgu-store.json
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-update catalog.json for release ${{ steps.prep.outputs.tag }}"
            git push origin main
          fi

      # The Store reads a Releases source through its `catalog` release when there is one: the only way a
      # tool (a native service, which a release asset cannot be) reaches the car. Every package, icon and
      # the catalog (absolute URLs into this release) go there; assets no longer listed are removed.
      # Updated before the numbered release, so the Store never sees a tool kit as an app package.
      - name: Update the catalog release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view catalog >/dev/null 2>&1; then
            gh release create catalog --title "Store catalog" --latest=false \
              --notes "The Store's catalog for this repository (catalog.json): every app and service of the latest release. Updated by the Publish Test Release workflow; never retired."
          fi
          gh release upload catalog dist/catalog-release/catalog.json packages/*.tgz *.png --clobber
          keep=$(ls packages/*.tgz *.png | xargs -n1 basename; echo catalog.json)
          gh release view catalog --json assets --jq '.assets[].name' | while read -r a; do
            echo "$keep" | grep -qxF "$a" || { echo "removing old asset $a"; gh release delete-asset catalog "$a" --yes; }
          done
          gh release view catalog --json assets --jq '.assets[].name'

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
          TITLE: ${{ steps.prep.outputs.title }}
        run: |
          echo "Processing release $TAG..."
          
          # Check if release already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets to existing release..."
            gh release upload "$TAG" packages/*.tgz mgu-store.json *.png --clobber
          else
            # test apps: published right away (no draft), so the Store offers them at once
            echo "Creating and publishing release $TAG..."
            gh release create "$TAG" packages/*.tgz mgu-store.json *.png \
              --latest \
              --title "$TITLE" \
              --notes-file release_notes.md
          fi
          
          echo "Release $TAG published: the Store offers it now."

      # the Store reads every published release: the older ones become pre-releases, so an app renamed
      # or moved never shows twice (a release published with this workflow's token starts no other workflow)
      - name: Retire the older releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.prep.outputs.tag }}
        run: tools/retire_older_releases.sh "$TAG"
